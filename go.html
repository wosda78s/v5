<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V5 · 线路导航</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "微软雅黑", system-ui, sans-serif;
    background: #0e1220; color: #e8eefc; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: min(520px, 94vw); padding: 34px 30px 26px; border-radius: 20px;
    background: rgba(20, 26, 44, .78); border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 24px 70px rgba(0,0,0,.55); backdrop-filter: blur(14px);
  }
  h1 { font-size: 20px; letter-spacing: 2px; }
  .sub { margin-top: 8px; font-size: 12.5px; color: #93a4c7; line-height: 1.6; }
  .node {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding: 11px 14px; border-radius: 12px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.10);
    font-size: 13px; color: #cfe4ff;
  }
  .node .st { font-size: 11.5px; color: #8fa2c8; }
  .node.ok .st { color: #7dffb3; }
  .node.bad .st { color: #ff9b9b; }
  .node a { color: #9ed8ff; text-decoration: none; }
  .btn {
    margin-top: 18px; width: 100%; height: 46px; border: 0; border-radius: 12px;
    font: 700 15px "微软雅黑"; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff5fa8, #8a4df0 70%);
  }
  .btn[disabled] { filter: grayscale(.5) brightness(.7); cursor: wait; }
  .hint { margin-top: 14px; font-size: 12px; color: #64759b; line-height: 1.7; }
  #big { margin-top: 18px; text-align: center; font-size: 14px; color: #ffd166; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>V5 · 线路导航</h1>
  <div class="sub">正在并行检测可用线路，谁的线路先通会自动进入。<br>如果全部连不上，下面会列出所有入口，可手动点开或换个网络重试。</div>
  <div id="list"></div>
  <button class="btn" id="retry">重新检测</button>
  <div id="big"></div>
  <div class="hint">提示：本页不依赖任何外部资源，可单独保存/转发。主站打不开时优先用本页或备用入口。</div>
</div>
<script>
(function () {
  'use strict';
  // ====== 线路清单（发布到 GitHub Pages / Netlify 后把地址补进来即可） ======
  var NODES = [
    { name: '主站（域名）', url: 'https://v5.154-94-226-119.sslip.io/v5/' },
    { name: 'GitHub Pages（国内可达）', url: 'https://wosda78s.github.io/v5/' },
    { name: 'IP 直连（证书警告请点继续）', url: 'https://154.94.226.119:8445/v5/', loose: true },
    // 例：Netlify 发布后填：  { name: 'Netlify', url: 'https://<site>.netlify.app/' }
  ];
  var TIMEOUT_MS = 2600;

  var listEl = document.getElementById('list');
  var bigEl = document.getElementById('big');
  var retryEl = document.getElementById('retry');

  function render(status) {
    listEl.innerHTML = '';
    NODES.forEach(function (n, i) {
      var div = document.createElement('div');
      div.className = 'node' + (status[i] === true ? ' ok' : status[i] === false ? ' bad' : '');
      var label = document.createElement('a');
      label.href = n.url; label.textContent = n.name;
      if (n.loose) label.target = '_blank';
      var st = document.createElement('span');
      st.className = 'st';
      st.textContent = status[i] === true ? '可连通' : status[i] === false ? '连不上' : '检测中…';
      div.appendChild(label); div.appendChild(st);
      listEl.appendChild(div);
    });
  }

  function probe(url) {
    return new Promise(function (resolve) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(false); } }, TIMEOUT_MS);
      fetch(url, { mode: 'no-cors', cache: 'no-store' })
        .then(function () { if (!done) { done = true; clearTimeout(t); resolve(true); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(false); } });
    });
  }

  async function run() {
    retryEl.disabled = true;
    bigEl.textContent = '';
    var status = new Array(NODES.length).fill(null);
    render(status);
    var finished = false;
    var winner = null;
    var attempts = NODES.map(function (n, i) {
      return probe(n.url).then(function (ok) {
        status[i] = ok;
        render(status);
        if (ok && !winner) {
          winner = n;
          if (!finished) {
            finished = true;
            bigEl.textContent = '已找到可用线路，正在进入…';
            setTimeout(function () { location.href = n.url; }, 220);
          }
        }
      });
    });
    await Promise.all(attempts);
    if (!winner) {
      bigEl.textContent = '所有线路都连不上：换个网络（或开热点）再点「重新检测」';
      retryEl.disabled = false;
      return;
    }
    // 2.6 秒内已有赢家时不再重置按钮
    setTimeout(function () { retryEl.disabled = false; }, 3000);
  }

  retryEl.addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
